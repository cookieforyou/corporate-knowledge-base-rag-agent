# ============================================================
# kb-ai-core — AI 模型 & 可观测性配置
# ============================================================
spring:
  ai:
    vectorstore:
      type: custom

    # ── Model Provider 选择 ──
    # v2.19（簇③ D1）：chat 置 none——主模型改由 SmartRoutingConfig 手工装配为
    # OpenAI 兼容形态（开 stream_options.include_usage 修复流式配额漏算）。
    # deepseek starter 自动装配的 @ConditionalOnProperty havingValue=deepseek，
    # 此处若回写 deepseek 会与手工 Bean 同名冲突致启动失败（DeepSeekModelOverrideWiringTest 钉死）
    model:
      chat: none                             # 主模型手工装配（见上注）
      embedding: openai                      # OpenAI 兼容（实际指向百炼）

    # ── DeepSeek V4 Chat ──
    # v2.19（簇③ D1）起消费方变更：下列键经 SmartRoutingConfig @Value 读取，
    # 不再被 starter 自动装配消费（chat=none 已令其让位）。
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
        temperature: 0.1
        max-tokens: 4096

    # ── 阿里云百炼 Embedding（OpenAI 兼容 API） ──
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      embedding:
        model: ${DASHSCOPE_EMBEDDING_MODEL:qwen3.7-text-embedding}

    chat:
      # 观测内容开关（Phase 4 簇①）：prompt/completion 全文附入 observation，经 OTel
      # 桥接落 span attribute 导出 Langfuse。实证坑：本文件经 spring.config.import 导入、
      # 优先级高于 kb-api application.yml——内容开关唯一来源在此（application.yml 不重复
      # 定义）。SaaS 出境合规风险已在簇①定案时知悉接受；关闭置 RAG_OBSERVABILITY_LOG_CONTENT=false
      observations:
        log-prompt: ${RAG_OBSERVABILITY_LOG_CONTENT:true}
        log-completion: ${RAG_OBSERVABILITY_LOG_CONTENT:true}
        include-error-logging: true
      client:
        observations:
          log-prompt: ${RAG_OBSERVABILITY_LOG_CONTENT:true}
          log-completion: ${RAG_OBSERVABILITY_LOG_CONTENT:true}
    tools:
      observations:
        include-content: ${RAG_OBSERVABILITY_LOG_CONTENT:true}
      # ── 会话记忆（3.1）—— Redis 热存储（设计文档 11.2，v2.3 实证修正）──
      # 连接信息（host/port/password/database）统一取自 spring.data.redis.*
      # （见 ChatMemoryRedisClientConfig 覆盖自动配置 jedisClient，支持密码认证）；
      # 此处仅记忆专属配置。initialize-schema 首建 FT.CREATE 索引；读/写故障由
      # FaultTolerantChatMemory 降级为空记忆，不击穿核心问答链路。
      memory:
        redis:
          index-name: ${CHAT_MEMORY_INDEX:kb-chat-memory-idx}
          key-prefix: ${CHAT_MEMORY_KEY_PREFIX:kb:chat-memory:}
          time-to-live: ${CHAT_MEMORY_TTL:24h}
          initialize-schema: true

# ============================================================
# 检索重排序（2.9）—— DashScope rerank API，故障自动降级为 fusion_score 截断
# ============================================================
rag:
  # 全链路审计（3.12，设计文档 11.6）——AuditTraceAdvisor(order 10) 异步落 kb_audit_log
  audit:
    enabled: ${RAG_AUDIT_ENABLED:true}
  # 工具审批（3.4 HITL，设计文档 11.2.1）——审批单 Redis 账本
  # （rag:tool-approval:{approvalId}，绑定 tenant/user + 一次性消费 + TTL）
  tool:
    approval:
      ttl-minutes: ${RAG_TOOL_APPROVAL_TTL_MINUTES:10}
  # 多模型路由（3.2，设计文档 11.2.2）—— 主模型 DeepSeek V4 + 备用 qwen3.7-plus
  # 熔断切换（连续失败 failure-threshold 次 → OPEN open-seconds 秒直发备用，
  # 窗口后 HALF_OPEN 试探）；备用为百炼 OpenAI 兼容端点，复用 DASHSCOPE_API_KEY
  routing:
    fallback:
      enabled: ${RAG_ROUTING_FALLBACK_ENABLED:true}
      model: ${RAG_ROUTING_FALLBACK_MODEL:qwen3.7-plus}
      base-url: ${RAG_ROUTING_FALLBACK_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${RAG_ROUTING_FALLBACK_API_KEY:${DASHSCOPE_API_KEY:}}
      temperature: ${RAG_ROUTING_FALLBACK_TEMPERATURE:0.1}
      # qwen3.5/3.6/3.7 商业版默认开思考模式（enable_thinking=true）：每次调用先生成
      # 大量思维链，E2E 实测单调用 20-60s——故障接管场景默认显式关闭
      enable-thinking: ${RAG_ROUTING_FALLBACK_ENABLE_THINKING:false}
    circuit:
      failure-threshold: ${RAG_ROUTING_FAILURE_THRESHOLD:5}   # 连续失败熔断阈值
      open-seconds: ${RAG_ROUTING_OPEN_SECONDS:30}             # 熔断窗口（秒）
    # 意图分类免检索短路（5.4 收窄版，设计文档 11.4）——rag 链内闲聊/对话元问题
    # 旁路检索直答；分类与改写合并单次 LLM 调用，fail-open 回落完整检索
    intent:
      enabled: ${RAG_ROUTING_INTENT_ENABLED:true}              # 总开关（false 回退现状全量检索）
      history-size: ${RAG_ROUTING_INTENT_HISTORY_SIZE:6}       # 分类器输入的历史消息条数
  # 用户反馈（3.17）：归档为异步旁路，反馈早于消息行落库的极端时序由短窗口轮询兜底
  feedback:
    message-wait-millis: ${RAG_FEEDBACK_MESSAGE_WAIT_MILLIS:2000}
  # 租户级限流（3.7，设计文档 11.2）—— Redisson 令牌桶，每租户独立桶
  # （rag:ratelimit:tenant:{tenantId}）；进程对每租户首次触达覆盖式写入配置
  ratelimit:
    enabled: ${RAG_RATELIMIT_ENABLED:true}
    tenant:
      rate: ${RAG_RATELIMIT_RATE:60}                  # 时间窗内允许请求数
      interval-seconds: ${RAG_RATELIMIT_INTERVAL_SECONDS:60}
  # 租户级 Token 预算（3.8，设计文档 12.3）—— Redis 日账本
  # （rag:token-budget:{tenant}:{日期}，2 日 TTL）+ Micrometer rag.token.total
  token-budget:
    enabled: ${RAG_TOKEN_BUDGET_ENABLED:true}
    daily-limit: ${RAG_TOKEN_BUDGET_DAILY_LIMIT:1000000}
  # MCP 治理（簇⑤ 4.10 基础键经 @Value 默认值收口；安全簇② B3 补配额与审计）
  mcp:
    # 只读工具（search/get_document）租户级限流——独立桶 rag:ratelimit:mcp:{tenant}
    # 与对话链桶分账；Redis 故障 fail-open（只读路径限流是可用性管控非安全边界）；
    # 超限 rag.guardrail.mcp.ratelimited 计数 + RATE_LIMITED 经 MCP 错误帧回传
    ratelimit:
      enabled: ${RAG_MCP_RATELIMIT_ENABLED:true}
      tenant:
        rate: ${RAG_MCP_RATELIMIT_RATE:120}                  # 只读调用密度高于对话链
        interval-seconds: ${RAG_MCP_RATELIMIT_INTERVAL_SECONDS:60}
    # 只读工具轻量审计：结构化日志恒开；DB 轻行（kb_audit_log mode=mcp）默认关，
    # 先经日志面观察体量与价值再定口径（专项方案 §4.2 B3）
    audit:
      enabled: ${RAG_MCP_AUDIT_ENABLED:false}
  # 安全护栏（3.5/3.6，设计文档 12.1/12.2/12.7）—— 词表本体收编结构化文件
  # guardrail/injection-rules.yml / output-rules.yml（逐条 Base64 编码态，
  # 安全簇① T2 起字面词表退役；T3 增 REGEX 结构模式轨，词面经 T4 带外通道
  # tools/guardrail/import_words.py 注入）；本处 CSV 键仅保留为运维侧带外扩充
  # 兼容源（并入合并语义）。词表文件外部覆盖：rag.guardrail.rules.injection-location /
  # output-location（classpath:/file: 前缀；资源缺失回落内置缺省文件）。
  guardrail:
    # PII 识别器注册表（安全簇③ C1/C2，专项方案 §4.3）：每类型独立识别器
    # （模式/置信度/掩码策略/enabled 开关），Java 原生对齐 Presidio 语义；
    # 七类确定性识别器默认全开（手机/身份证/邮箱既有 + 银行卡 Luhn/座机/车牌/
    # IPv4 C1 新增），类型开关为误报治理运维绕开面；环境变量覆盖走松散绑定
    # （如 RAG_GUARDRAIL_PII_BANK_CARD_ENABLED=false）。name/address 为 C3 登记项
    # （NER 依赖未实现）默认关，开关预留置 true 仅启动 warn 提示无效。
    pii:
      phone:
        enabled: true
      id-card:
        enabled: true
      email:
        enabled: true
      bank-card:
        enabled: true
      landline:
        enabled: true
      license-plate:
        enabled: true
      ipv4:
        enabled: true
      name:
        enabled: false    # C3 登记项：NER 依赖未实现，待干净集误报度量后评估
      address:
        enabled: false    # C3 登记项：同上
    input:
      # 注入检测兼容词表（CSV 并入结构化基线）：留空 → 仅 bundled 基线词表
      injection-keywords:
    output:
      # 输出检测兼容词表（CSV 并入结构化基线）：留空 → 仅 bundled 基线词表
      blacklist:
      # 系统提示金丝雀（安全簇① T5）：启动时随机 token 内嵌双链系统提示，
      # 输出回显即确证提示泄露 → 整段替换 + 指标 rag.guardrail.output.canary
      canary:
        enabled: ${RAG_GUARDRAIL_OUTPUT_CANARY_ENABLED:true}
    # 间接注入运行时扫描（安全簇④ D1，设计 §12.8）：召回证据入 grounding 前经
    # 注入词表同源检测视图逐条扫描——warn（默认）命中逐条警示注记 / exclude 剔除
    # 命中证据（全剔回落空证据拒答）。指标 rag.guardrail.indirect.flagged /
    # excluded；扫描位序在 rerank 之前，TRACE/[ref-N] 三面对齐不破。
    indirect:
      scan:
        enabled: ${RAG_GUARDRAIL_INDIRECT_SCAN_ENABLED:true}
      strategy: ${RAG_GUARDRAIL_INDIRECT_STRATEGY:warn}   # warn | exclude
    # L2 语义判定层（安全簇⑤ E1，设计 §12.1.1/12.4 S5）：REGEX 结构模式可疑且
    # 干词未命中的输入经备用模型 qwen3.7-plus 结构化二判（PASS/SUSPECT/BLOCK），
    # order 320 挂双链（L1 300 之后、记忆 400 之前）；超时/失败 fail-open 回落
    # L1 结论。指标 rag.guardrail.l2.triggered/blocked/suspect/error（触发率
    # = triggered/request.total）；跨轮信号读近 history-size 条记忆拼接视图。
    l2:
      enabled: ${RAG_GUARDRAIL_L2_ENABLED:true}                    # 总开关（运维回退阀门）
      timeout-seconds: ${RAG_GUARDRAIL_L2_TIMEOUT_SECONDS:3}       # 二判超时（秒），超时 fail-open
      history-size: ${RAG_GUARDRAIL_L2_HISTORY_SIZE:6}             # 跨轮信号与判定上下文的历史条数
    # 词表热重载（安全簇⑥ F1，设计 12.4 S8 Git Ops 词表运营）：词表文件以 Git 为
    # 单一事实源，经 file: 外部覆盖 + 重载信号免重启生效。双触发通道——pub/sub 即时
    # 信号（频道 rag:guardrail:reload，tools/guardrail/publish_reload_signal.py 发布）
    # + file: 源 mtime 轮询回落（信号丢失/Redis 不可达窗口兜底；jar 内 classpath 源
    # 不轮询）。装载失败 fail-keep 保旧快照。kb-eval 经 web-none 结构隔离天然不装配
    # （测量一致性）。指标 rag.guardrail.reload.succeeded/failed。
    reload:
      enabled: ${RAG_GUARDRAIL_RELOAD_ENABLED:true}                          # 总开关（运维回退阀门）
      poll-interval-seconds: ${RAG_GUARDRAIL_RELOAD_POLL_INTERVAL_SECONDS:60}  # file: 源 mtime 轮询间隔
  # 模块化 RAG 检索开关（2.10，设计文档 10.6）
  retrieval:
    rewrite:
      enabled: ${RAG_REWRITE_ENABLED:true}      # 查询改写：多轮指代消解，默认开
    expansion:                                  # 多查询扩展（簇① A1 A/B 决策：默认关）
      enabled: ${RAG_RETRIEVAL_EXPANSION_ENABLED:false}    # 增益 MRR +0.025 / Recall +0.006，不抵 TTFT 代价
      num-queries: ${RAG_RETRIEVAL_EXPANSION_NUM_QUERIES:3}  # 查询变体数（检索调用放大倍数）
    # ── 调优参数（簇① A3 配置化，默认值 = Phase 2 基线形态，行为零变化）──
    # 修改任一参数即改变检索形态，须复跑 kb-eval 基线对比后再定默认值
    top-k: ${RAG_RETRIEVAL_TOP_K:5}                              # 最终证据条数（rerank top_n / 截断）
    rrf-k: ${RAG_RETRIEVAL_RRF_K:60}                             # RRF 融合常数（标准值 60）
    recall-multiplier: ${RAG_RETRIEVAL_RECALL_MULTIPLIER:2}      # 召回放大系数：recallSize = top-k × N
    similarity-threshold: ${RAG_RETRIEVAL_SIMILARITY_THRESHOLD:0.5}  # 向量路相似度阈值
    path-timeout-seconds: ${RAG_RETRIEVAL_PATH_TIMEOUT_SECONDS:5}    # 单路检索超时（秒），超时降级为空
    # 入库打标 injection_hit 消费降权（安全簇④ D2，§9 定案④）：**默认关**——
    # 先经 kb-eval 检索门禁（Recall/MRR）开关双跑度量影响再定开关口径。
    # 开启后命中 chunk 融合分乘 factor 衰减（rag.retrieval.injection-hit.demoted 计数）
    injection-hit:
      demote:
        enabled: ${RAG_RETRIEVAL_INJECTION_HIT_DEMOTE_ENABLED:false}
        factor: ${RAG_RETRIEVAL_INJECTION_HIT_DEMOTE_FACTOR:0.5}
  rerank:
    endpoint: ${RERANK_ENDPOINT:https://dashscope.aliyuncs.com/compatible-api/v1/reranks}
    model: ${RERANK_MODEL:qwen3-rerank}
    api-key: ${DASHSCOPE_API_KEY:}
    timeout-seconds: ${RERANK_TIMEOUT_SECONDS:5}   # connect/read 超时（簇③ D2），与单路检索超时对齐；超时走 fusion_score 截断降级

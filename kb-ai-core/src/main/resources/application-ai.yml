# ============================================================
# kb-ai-core — AI 模型 & 可观测性配置
# ============================================================
spring:
  ai:
    vectorstore:
      type: custom

    # ── Model Provider 选择 ──
    # v2.19（簇③ D1）：chat 置 none——主模型改由 SmartRoutingConfig 手工装配为
    # OpenAI 兼容形态（开 stream_options.include_usage 修复流式配额漏算）。
    # v2.77（模型层批B）：deepseek starter 依赖已移除，本键不再有让位对象，
    # 保留为防御位——防未来误引 chat starter 自动装配与手工主模型冲突
    model:
      chat: none                             # 主模型手工装配（见上注）
      embedding: openai                      # OpenAI 兼容（实际指向百炼）

    # ── 阿里云百炼 Embedding（OpenAI 兼容 API） ──
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      embedding:
        model: ${DASHSCOPE_EMBEDDING_MODEL:qwen3.7-text-embedding}

    chat:
      # 观测内容开关（Phase 4 簇①）：prompt/completion 全文附入 observation，经 OTel
      # 桥接落 span attribute 导出 Langfuse。实证坑：本文件经 spring.config.import 导入、
      # 优先级高于 kb-api application.yml——内容开关唯一来源在此（application.yml 不重复定义）
      # SaaS 出境合规风险已在簇①定案时知悉接受；关闭置 RAG_OBSERVABILITY_LOG_CONTENT=false
      # 原配置：
      # chat.observations:
      #   log-prompt: false
      #   log-completion: true
      #   include-error-logging: true
      observations:
        log-prompt: ${RAG_OBSERVABILITY_LOG_CONTENT:true}
        log-completion: ${RAG_OBSERVABILITY_LOG_CONTENT:true}
        include-error-logging: true
      client:
        observations:
          log-prompt: ${RAG_OBSERVABILITY_LOG_CONTENT:true}
          log-completion: ${RAG_OBSERVABILITY_LOG_CONTENT:true}
      # ── 会话记忆（3.1）—— Redis 热存储（设计文档 11.2，v2.3 实证修正）──
      # 【坑位㊹ 纠偏（2026-09-03）】本段自 3.1 起误挂 tools: 节点下——实际路径
      # spring.ai.tools.memory.*，Binder 从未命中，运行实态一直是框架缺省值
      # （索引 chat-memory-idx / 键前缀 chat-memory: / 无 TTL；initialize-schema
      # 缺省 true 恰与配置意图一致故未暴露）。修正挂载至 chat: 节点后配置首次
      # 生效：首建新索引 kb-chat-memory-idx，历史热记忆不迁移（续聊由 PG 归档
      # 回填机制自然接住），旧索引 chat-memory-idx 与无 TTL 旧键建议清理。
      # 连接桥接：2.0.1 起自动装配 jedisClient 消费本前缀的 host/port/password，
      # 占位符引用 spring.data.redis.*（与 Redisson 单一来源同源）；database 无
      # 字段，Jedis Builder 缺省 0 即 RediSearch db0 硬约束（REDIS_DB 须为 0，
      # 配置非 0 时记忆侧静默 db0、Redisson 侧分库——配置错仅波及 Redisson 域）。
      # 记忆专属配置：initialize-schema 首建 FT.CREATE 索引；读/写故障由
      # FaultTolerantChatMemory 降级为空记忆，不击穿核心问答链路。
      # 前缀 2.0.1 迁移：chat.memory.redis → chat.memory.repository.redis（旧前缀
      # 仅自动配置过渡回落，勿再使用）
      memory:
        repository:
          redis:
            host: ${spring.data.redis.host}
            port: ${spring.data.redis.port}
            password: ${spring.data.redis.password:}
            index-name: ${CHAT_MEMORY_INDEX:kb-chat-memory-idx}
            key-prefix: ${CHAT_MEMORY_KEY_PREFIX:kb:chat-memory:}
            time-to-live: ${CHAT_MEMORY_TTL:24h}
            initialize-schema: true
    tools:
      observations:
        include-content: ${RAG_OBSERVABILITY_LOG_CONTENT:true}

# ============================================================
# 检索重排序（2.9）—— DashScope rerank API，故障自动降级为 fusion_score 截断
# ============================================================
rag:
  # 全链路审计（3.12，设计文档 11.6）——AuditTraceAdvisor(order 10) 异步落 kb_audit_log
  audit:
    enabled: ${RAG_AUDIT_ENABLED:true}
  # 工具审批（3.4 HITL，设计文档 11.2.1）——审批单 Redis 账本
  # （rag:tool-approval:{approvalId}，绑定 tenant/user + 一次性消费 + TTL）
  tool:
    approval:
      ttl-minutes: ${RAG_TOOL_APPROVAL_TTL_MINUTES:10}
  # 多子代理编排（簇⑤ 5.3，设计文档 §11.5.5）——Orchestrator-Workers 收窄骨架：
  # mode=agent 第三链，主 Agent 仅持 task 委派工具。enabled 缺省关——关闭态编排族
  # Bean 整体缺位（rag/tool 两链逐字节零变化），mode=agent 显式 400
  # ORCHESTRATOR_DISABLED；真实工具立项后升级回原验收（>85% 任务完成率）
  orchestrator:
    enabled: ${RAG_ORCHESTRATOR_ENABLED:false}
    # 子代理单次委派有界超时（秒）——非打断式弃任务（坑位㊶），防真实工具拖死主链
    subagent-timeout-seconds: ${RAG_ORCHESTRATOR_SUBAGENT_TIMEOUT_SECONDS:60}
  # 多模型路由（3.2，设计文档 11.2.2）—— 主模型双形态开关（v2.77 模型层批B）+
  # 备用 qwen3.8-flash 熔断切换（连续失败 failure-threshold 次 → OPEN
  # open-seconds 秒直发备用，窗口后 HALF_OPEN 试探）；备用为百炼 OpenAI 兼容端点，
  # 复用 DASHSCOPE_API_KEY。意图路由(440)/查询改写经 RetrievalConfig 轻任务
  # Builder 挂备用模型（v2.77，防主模型思维链拖垮 TTFT）
  routing:
    # ── 主模型双形态（GLM 缺省 / DeepSeek 回落，环境变量一切即切）──
    primary:
      provider: ${RAG_ROUTING_PRIMARY_PROVIDER:glm}
      # GLM-5.3-Flash（缺省主答）：强制思考不可关（官方：thinking.type 仅支持
      # enabled，传 disabled 报错）；reasoning-effort 支持 low/high/max（其余值报错）。
      # effort 生产档 low（2026-09-01 冒烟定案，v2.78）：服务端 max 档思维链致
      # 20-31s 级延迟（completion 900-1050 含思维链，~35-45 tok/s；DeepSeek 思考开
      # high 时代基线 5-8s），low 档召回 RAG 主答语境足用，TTFT 优先。
      # temperature 生产档 0.2（2026-09-02 门禁消融定案，16 章 v2.95）：GLM 思考态
      # 采样参数生效（与 DeepSeek 思考态静默忽略不同），官方推荐 1.0；0.2 全面小胜
      # 1.0（CA 0.764→0.782 / AC 4.682→4.755 / F 4.209→4.364 / MULTI_DOC F
      # 2.111→3.333，HR 持平），温度为次要变量（HR 6.2% 不动——细节保真度归因
      # effort 档，人审定谳见 16 章 v2.95）。温度不跨模型对齐：DeepSeek/qwen
      # 备用 0.1 为各自保守档，量纲不可比
      glm:
        base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        api-key: ${ZHIPU_API_KEY:}
        model: ${ZHIPU_MODEL:glm-5.3-flash}
        temperature: ${ZHIPU_TEMPERATURE:0.2}
        max-tokens: ${ZHIPU_MAX_TOKENS:4096}
        reasoning-effort: ${ZHIPU_REASONING_EFFORT:low}
      # DeepSeek V4 Flash（回落形态）：官方实证「思考模式默认开 + effort 默认
      # high」「思考模式下 temperature 等采样参数静默忽略」——历史形态主路一直
      # 思考开 high 运行（temperature 0.1 从未生效）。回落缺省显式关思考（快答
      # 定位，关思考后采样参数恢复支持）；如需保留思考置 enabled + effort 调档
      deepseek:
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        api-key: ${DEEPSEEK_API_KEY:}
        model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
        temperature: ${DEEPSEEK_TEMPERATURE:0.1}
        max-tokens: ${DEEPSEEK_MAX_TOKENS:4096}
        thinking-type: ${DEEPSEEK_THINKING_TYPE:disabled}    # enabled | disabled
        reasoning-effort: ${DEEPSEEK_REASONING_EFFORT:}      # low|high|max，仅 enabled 时透传
    fallback:
      enabled: ${RAG_ROUTING_FALLBACK_ENABLED:true}
      model: ${RAG_ROUTING_FALLBACK_MODEL:qwen3.8-flash}
      base-url: ${RAG_ROUTING_FALLBACK_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${RAG_ROUTING_FALLBACK_API_KEY:${DASHSCOPE_API_KEY:}}
      temperature: ${RAG_ROUTING_FALLBACK_TEMPERATURE:0.1}
      # qwen 商业版（3.5+ 各代）默认开思考模式（enable_thinking=true）：每次调用先生成
      # 大量思维链，E2E 实测单调用 20-60s——故障接管场景默认显式关闭
      enable-thinking: ${RAG_ROUTING_FALLBACK_ENABLE_THINKING:false}
    circuit:
      failure-threshold: ${RAG_ROUTING_FAILURE_THRESHOLD:5}   # 连续失败熔断阈值
      open-seconds: ${RAG_ROUTING_OPEN_SECONDS:30}             # 熔断窗口（秒）
    # 意图分类免检索短路（5.4 收窄版，设计文档 11.4）——rag 链内闲聊/对话元问题
    # 旁路检索直答；分类与改写合并单次 LLM 调用，fail-open 回落完整检索
    intent:
      enabled: ${RAG_ROUTING_INTENT_ENABLED:true}              # 总开关（false 回退现状全量检索）
      history-size: ${RAG_ROUTING_INTENT_HISTORY_SIZE:6}       # 分类器输入的历史消息条数
  # 用户反馈（3.17）：归档为异步旁路，反馈早于消息行落库的极端时序由短窗口轮询兜底
  feedback:
    message-wait-millis: ${RAG_FEEDBACK_MESSAGE_WAIT_MILLIS:2000}
  # 租户级限流（3.7，设计文档 11.2）—— Redisson 令牌桶，每租户独立桶
  # （rag:ratelimit:tenant:{tenantId}）；进程对每租户首次触达覆盖式写入配置
  ratelimit:
    enabled: ${RAG_RATELIMIT_ENABLED:true}
    tenant:
      rate: ${RAG_RATELIMIT_RATE:60}                  # 时间窗内允许请求数
      interval-seconds: ${RAG_RATELIMIT_INTERVAL_SECONDS:60}
  # 租户级 Token 预算（3.8，设计文档 12.3）—— Redis 日账本
  # （rag:token-budget:{tenant}:{日期}，2 日 TTL）+ Micrometer rag.token.total
  token-budget:
    enabled: ${RAG_TOKEN_BUDGET_ENABLED:true}
    daily-limit: ${RAG_TOKEN_BUDGET_DAILY_LIMIT:1000000}
  # MCP 治理（簇⑤ 4.10 基础键经 @Value 默认值收口；安全簇② B3 补配额与审计）
  mcp:
    # 只读工具（search/get_document）租户级限流——独立桶 rag:ratelimit:mcp:{tenant}
    # 与对话链桶分账；Redis 故障 fail-open（只读路径限流是可用性管控非安全边界）；
    # 超限 rag.guardrail.mcp.ratelimited 计数 + RATE_LIMITED 经 MCP 错误帧回传
    ratelimit:
      enabled: ${RAG_MCP_RATELIMIT_ENABLED:true}
      tenant:
        rate: ${RAG_MCP_RATELIMIT_RATE:120}                  # 只读调用密度高于对话链
        interval-seconds: ${RAG_MCP_RATELIMIT_INTERVAL_SECONDS:60}
    # 只读工具轻量审计：结构化日志恒开；DB 轻行（kb_audit_log mode=mcp）默认关，
    # 先经日志面观察体量与价值再定口径（专项方案 §4.2 B3）
    audit:
      enabled: ${RAG_MCP_AUDIT_ENABLED:false}
  # 安全护栏（3.5/3.6，设计文档 12.1/12.2/12.7）—— 词表本体收编结构化文件
  # guardrail/injection-rules.yml / output-rules.yml（逐条 Base64 编码态，
  # 安全簇① T2 起字面词表退役；T3 增 REGEX 结构模式轨，词面经 T4 带外通道
  # tools/guardrail/import_words.py 注入）；本处 CSV 键仅保留为运维侧带外扩充
  # 兼容源（并入合并语义）。词表文件外部覆盖：rag.guardrail.rules.injection-location /
  # output-location（classpath:/file: 前缀；资源缺失回落内置缺省文件；整体覆盖
  # 语义——外部文件必须为完整词表，v2.50 E2E 实证，详见 rag.guardrail.rules 段注释）。
  guardrail:
    # PII 识别器注册表（安全簇③ C1/C2，专项方案 §4.3）：每类型独立识别器
    # （模式/置信度/掩码策略/enabled 开关），Java 原生对齐 Presidio 语义；
    # 七类确定性识别器默认全开（手机/身份证/邮箱既有 + 银行卡 Luhn/座机/车牌/
    # IPv4 C1 新增），类型开关为误报治理运维绕开面；环境变量覆盖走松散绑定
    # （如 RAG_GUARDRAIL_PII_BANK_CARD_ENABLED=false）。name/address 为 C3 登记项
    # （NER 依赖未实现）默认关，开关预留置 true 仅启动 warn 提示无效。
    pii:
      phone:
        enabled: true
      id-card:
        enabled: true
      email:
        enabled: true
      bank-card:
        enabled: true
      landline:
        enabled: true
      license-plate:
        enabled: true
      ipv4:
        enabled: true
      name:
        enabled: false    # C3 登记项：NER 依赖未实现，待干净集误报度量后评估
      address:
        enabled: false    # C3 登记项：同上
    input:
      # 注入检测兼容词表（CSV 并入结构化基线）：留空 → 仅 bundled 基线词表
      injection-keywords:
    output:
      # 输出检测兼容词表（CSV 并入结构化基线）：留空 → 仅 bundled 基线词表
      blacklist:
      # 系统提示金丝雀（安全簇① T5）：启动时随机 token 内嵌双链系统提示，
      # 输出回显即确证提示泄露 → 整段替换 + 指标 rag.guardrail.output.canary
      canary:
        enabled: ${RAG_GUARDRAIL_OUTPUT_CANARY_ENABLED:true}
    # 间接注入运行时扫描（安全簇④ D1，设计 §12.8）：召回证据入 grounding 前经
    # 注入词表同源检测视图逐条扫描——warn（默认）命中逐条警示注记 / exclude 剔除
    # 命中证据（全剔回落空证据拒答）。指标 rag.guardrail.indirect.flagged /
    # excluded；扫描位序在 rerank 之前，TRACE/[ref-N] 三面对齐不破。
    indirect:
      scan:
        enabled: ${RAG_GUARDRAIL_INDIRECT_SCAN_ENABLED:true}
      strategy: ${RAG_GUARDRAIL_INDIRECT_STRATEGY:warn}   # warn | exclude
    # L2 语义判定层（安全簇⑤ E1，设计 §12.1.1/12.4 S5）：REGEX 结构模式可疑且
    # 干词未命中的输入经备用模型 qwen3.8-flash 结构化二判（PASS/SUSPECT/BLOCK），
    # order 320 挂双链（L1 300 之后、记忆 400 之前）；超时/失败 fail-open 回落
    # L1 结论。指标 rag.guardrail.l2.triggered/blocked/suspect/error（触发率
    # = triggered/request.total）；跨轮信号读近 history-size 条记忆拼接视图。
    l2:
      enabled: ${RAG_GUARDRAIL_L2_ENABLED:true}                    # 总开关（运维回退阀门）
      timeout-seconds: ${RAG_GUARDRAIL_L2_TIMEOUT_SECONDS:3}       # 二判超时（秒），超时 fail-open
      history-size: ${RAG_GUARDRAIL_L2_HISTORY_SIZE:6}             # 跨轮信号与判定上下文的历史条数
    # 词表热重载（安全簇⑥ F1，设计 12.4 S8 Git Ops 词表运营）：词表文件以 Git 为
    # 单一事实源，经 file: 外部覆盖 + 重载信号免重启生效。双触发通道——pub/sub 即时
    # 信号（频道 rag:guardrail:reload，tools/guardrail/publish_reload_signal.py 发布）
    # + file: 源 mtime 轮询回落（信号丢失/Redis 不可达窗口兜底；jar 内 classpath 源
    # 不轮询）。装载失败 fail-keep 保旧快照。kb-eval 经 web-none 结构隔离天然不装配
    # （测量一致性）。指标 rag.guardrail.reload.succeeded/failed。
    reload:
      enabled: ${RAG_GUARDRAIL_RELOAD_ENABLED:true}                          # 总开关（运维回退阀门）
      poll-interval-seconds: ${RAG_GUARDRAIL_RELOAD_POLL_INTERVAL_SECONDS:60}  # file: 源 mtime 轮询间隔
    # 词表文件外部覆盖位置（classpath:/file: 前缀；资源缺失回落内置缺省文件）。
    # **覆盖语义（v2.50 E2E 实证钉死）**：外部文件整体顶替内置缺省词表，非增量
    # 并入——外部路径必须持完整词表文件（仓库词表经 import_words.py 增量改后整文件同步）。
    rules:
      # 源选择（v2.53 词表 DB 单轨，12.7 词表工程 / Plan C 修订形态）：
      # file = Git Ops 形态（缺省，回滚阀门；kb-eval 恒走此源测量锁版）；
      # db = kb_guardrail_rule 表唯一事实源（CRUD 运营 API 直写，须先在 ECS 执行
      # 建表 DDL；首启 GuardrailRulesSeeder 自动迁移文件源有效全集，幂等）。
      source: ${RAG_GUARDRAIL_RULES_SOURCE:file}
      # DB 单轨存档导出目录（写操作后自动导出双侧编码 YAML 供 git 归档 / eval
      # 引用 / 回滚指回；空 = 跳过导出）。仅 source=db 运营面消费。
      export-dir: ${RAG_GUARDRAIL_RULES_EXPORT_DIR:}
      injection-location: ${RAG_GUARDRAIL_RULES_INJECTION_LOCATION:}
      output-location: ${RAG_GUARDRAIL_RULES_OUTPUT_LOCATION:}
  # 模块化 RAG 检索开关（2.10，设计文档 10.6）
  retrieval:
    rewrite:
      enabled: ${RAG_REWRITE_ENABLED:true}      # 查询改写：多轮指代消解，默认开
    expansion:                                  # 多查询扩展（簇① A1 A/B 决策：默认关）
      enabled: ${RAG_RETRIEVAL_EXPANSION_ENABLED:false}    # 增益 MRR +0.025 / Recall +0.006，不抵 TTFT 代价
      num-queries: ${RAG_RETRIEVAL_EXPANSION_NUM_QUERIES:3}  # 查询变体数（检索调用放大倍数）
    # ── 调优参数（簇① A3 配置化，默认值 = Phase 2 基线形态，行为零变化）──
    # 修改任一参数即改变检索形态，须复跑 kb-eval 基线对比后再定默认值
    top-k: ${RAG_RETRIEVAL_TOP_K:5}                              # 最终证据条数（rerank top_n / 截断）
    rrf-k: ${RAG_RETRIEVAL_RRF_K:60}                             # RRF 融合常数（标准值 60）
    recall-multiplier: ${RAG_RETRIEVAL_RECALL_MULTIPLIER:2}      # 召回放大系数：recallSize = top-k × N
    similarity-threshold: ${RAG_RETRIEVAL_SIMILARITY_THRESHOLD:0.5}  # 向量路相似度阈值
    path-timeout-seconds: ${RAG_RETRIEVAL_PATH_TIMEOUT_SECONDS:5}    # 单路检索超时（秒），超时降级为空
    # 入库打标 injection_hit 消费降权（安全簇④ D2，§9 定案④）：**默认关**——
    # 先经 kb-eval 检索门禁（Recall/MRR）开关双跑度量影响再定开关口径。
    # 开启后命中 chunk 融合分乘 factor 衰减（rag.retrieval.injection-hit.demoted 计数）
    injection-hit:
      demote:
        enabled: ${RAG_RETRIEVAL_INJECTION_HIT_DEMOTE_ENABLED:false}
        factor: ${RAG_RETRIEVAL_INJECTION_HIT_DEMOTE_FACTOR:0.5}
  # ── GraphRAG（Phase 5 簇④）：实体关系图谱 + 三路融合（向量+BM25+Graph，RRF K=60 同口径）──
  # 缺省关：整个图谱域（Driver/网关/抽取/图路检索）条件装配缺位，链形态与双路逐字节一致。
  # 启用前置：用户侧 .env 填 NEO4J_URI/NEO4J_USERNAME/NEO4J_PASSWORD（第二台 ECS 自托管
  # Community 实例，连接段落 application-infra.yml spring.neo4j.*）+ 存量回填（admin 端点）。
  # 验收线 = 多跳准确率 >80% + 抽取抽检 >85% + 三路融合 P95 <600ms + 开关关闭零回归。
  graph:
    enabled: ${RAG_GRAPH_ENABLED:false}
    # 抽取管道（5.1）：低价档结构化调用（百炼 qwen3.8-flash，与备用/评估链同源密钥），
    # 限流双层 = 每租户令牌桶（避业务高峰 + 供应商 RPM 护栏）+ JVM 在飞并发信号量
    extraction:
      base-url: ${RAG_GRAPH_EXTRACTION_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${RAG_GRAPH_EXTRACTION_API_KEY:${DASHSCOPE_API_KEY:}}
      model: ${RAG_GRAPH_EXTRACTION_MODEL:qwen3.8-flash}
      rate: ${RAG_GRAPH_EXTRACTION_RATE:20}                          # 增量档每租户令牌桶速率（次/窗口；v2.78 实证 10→20，限流只布节奏不增成本）
      backfill-rate: ${RAG_GRAPH_BACKFILL_RATE:60}                   # 回填档速率（v2.79：显式有界批量，独立桶 …:backfill:{tenant}，令牌不再是墙钟瓶颈）
      rate-interval-seconds: ${RAG_GRAPH_EXTRACTION_RATE_INTERVAL_SECONDS:60}
      concurrency: ${RAG_GRAPH_EXTRACTION_CONCURRENCY:3}             # JVM 在飞抽取并发上限
      max-tokens: ${RAG_GRAPH_EXTRACTION_MAX_TOKENS:4000}            # 单次抽取响应上限（v2.78 实证 2000 截断富集片段）
      embed-batch-size: ${RAG_GRAPH_EXTRACTION_EMBED_BATCH_SIZE:10}  # 实体嵌入单批条数（同 ETL 分批纪律，供应商硬限 ≤20）
      max-chunk-chars: ${RAG_GRAPH_EXTRACTION_MAX_CHUNK_CHARS:1500}  # 单片段截断阈值
      min-chunk-chars: ${RAG_GRAPH_EXTRACTION_MIN_CHUNK_CHARS:20}    # 短片段跳过阈值
    # 图路检索（5.2）：检索期零 LLM——查询嵌入 → 向量索引实体匹配 → 邻域展开 → chunk 反查
    # （图路超时/降级经 rag.retrieval.path-timeout-seconds 与双路统一口径，不设独立键）
    retrieval:
      entity-top-n: ${RAG_GRAPH_ENTITY_TOP_N:5}                          # 种子实体上限
      # Neo4j 余弦得分为归一化形态（(1+cos)/2 ∈ [0,1]，0.5=正交，1=全同——IT 实证 +
      # 官方口径），0.7 ≈ 原始余弦 ≥ 0.4；调参须按此语义，勿当原始余弦解读（v2.80）
      entity-similarity-threshold: ${RAG_GRAPH_ENTITY_SIMILARITY_THRESHOLD:0.7}
      expand-neighbors: ${RAG_GRAPH_EXPAND_NEIGHBORS:true}               # 1 跳邻域展开（衰减 0.5）
  # ── 语义缓存（Phase 5 簇③ 5.6）：查询级语义缓存，Redis 8 内建搜索引擎（FT.* VECTOR）──
  # 命中短路「检索+重排+生成」全链重放缓存回答与溯源；缺省关（用户侧 E2E 验证后启用，
  # 同 eval L2 / 间接注入缺省关族纪律）；验收线 = 命中率 >30% + 命中延迟 P95 降 >40%（对照 18 §18.4）
  cache:
    enabled: ${RAG_CACHE_ENABLED:false}
    # 命中判定余弦相似度阈值（KNN 距离 ≤ 1 - 阈值判命中）；行业生产区间 0.90-0.95，
    # 0.95 保守起步——命中率不足时经配置下调观察误命中，不做无评估证据的调参
    similarity-threshold: ${RAG_CACHE_SIMILARITY_THRESHOLD:0.95}
    ttl: ${RAG_CACHE_TTL:1h}                      # 条目 TTL 兜底（知识库变更另有事件驱动即时失效）
    embedding-dim: ${RAG_CACHE_EMBEDDING_DIM:1024}  # 与主检索链路 EmbeddingModel 同源（1024 钉死）
  rerank:
    endpoint: ${RERANK_ENDPOINT:https://dashscope.aliyuncs.com/compatible-api/v1/reranks}
    model: ${RERANK_MODEL:qwen3-rerank}
    api-key: ${DASHSCOPE_API_KEY:}
    timeout-seconds: ${RERANK_TIMEOUT_SECONDS:5}   # connect/read 超时（簇③ D2），与单路检索超时对齐；超时走 fusion_score 截断降级

# ============================================================
# kb-ai-core — AI 模型 & 可观测性配置
# ============================================================
spring:
  ai:
    vectorstore:
      type: custom

    # ── Model Provider 选择 ──
    model:
      chat: deepseek                         # DeepSeek V4
      embedding: openai                      # OpenAI 兼容（实际指向百炼）

    # ── DeepSeek V4 Chat ──
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
        temperature: 0.1
        max-tokens: 4096

    # ── 阿里云百炼 Embedding（OpenAI 兼容 API） ──
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      embedding:
        model: ${DASHSCOPE_EMBEDDING_MODEL:qwen3.7-text-embedding}

    chat:
      observations:
        log-prompt: false
        log-completion: true
        include-error-logging: true
      # ── 会话记忆（3.1）—— Redis 热存储（设计文档 11.2，v2.3 实证修正）──
      # 连接信息（host/port/password/database）统一取自 spring.data.redis.*
      # （见 ChatMemoryRedisClientConfig 覆盖自动配置 jedisClient，支持密码认证）；
      # 此处仅记忆专属配置。initialize-schema 首建 FT.CREATE 索引；读/写故障由
      # FaultTolerantChatMemory 降级为空记忆，不击穿核心问答链路。
      memory:
        redis:
          index-name: ${CHAT_MEMORY_INDEX:kb-chat-memory-idx}
          key-prefix: ${CHAT_MEMORY_KEY_PREFIX:kb:chat-memory:}
          time-to-live: ${CHAT_MEMORY_TTL:24h}
          initialize-schema: true

# ============================================================
# 检索重排序（2.9）—— DashScope rerank API，故障自动降级为 fusion_score 截断
# ============================================================
rag:
  # 输出安全护栏（3.6，设计文档 12.2）—— 敏感词/竞品黑名单，逗号分隔；
  # L1 静态词表，生产接配置中心动态加载为升级项（12.2.1）
  guardrail:
    output:
      blacklist: ${RAG_GUARDRAIL_BLACKLIST:competitor_x,competitor_y}
  # 模块化 RAG 检索开关（2.10，设计文档 10.6）
  retrieval:
    rewrite:
      enabled: ${RAG_REWRITE_ENABLED:true}      # 查询改写：多轮指代消解，默认开
    expansion:
      enabled: ${RAG_EXPANSION_ENABLED:false}   # 多查询扩展：调用放大 N 倍损 TTFT，默认关
  rerank:
    endpoint: ${RERANK_ENDPOINT:https://dashscope.aliyuncs.com/compatible-api/v1/reranks}
    model: ${RERANK_MODEL:qwen3-rerank}
    api-key: ${DASHSCOPE_API_KEY:}

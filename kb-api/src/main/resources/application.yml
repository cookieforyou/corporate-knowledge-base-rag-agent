spring:
  config:
    import:
      - classpath:application-infra.yml
      - classpath:application-ai.yml

  application:
    name: kb-rag-agent

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 虚拟线程
  threads:
    virtual:
      enabled: true

  # JPA 行为配置（连接配置在 kb-infrastructure）
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}

  # MCP Server（Phase 4 簇⑤ 4.10）：Streamable HTTP 传输，端点 /mcp（RouterFunction
  # 形态，SecurityConfig requestMatchers 拦截）。@McpTool 注解扫描器默认开——
  # kb-ai-agent McpKnowledgeTools 三件套自动收编；type=sync 同步执行（工具在
  # 请求线程跑，SecurityContext 可用，身份经 McpIdentityGuard 捕获转参数链）。
  # scope 治理 rag.mcp.scope.required / 文档截断 rag.mcp.get-document.max-chunks
  # 经 @Value 默认值收口（McpIdentityGuard / McpKnowledgeTools）
  ai:
    mcp:
      server:
        name: kb-rag-agent
        version: 1.0.0
        instructions: >-
          企业知识库 MCP Server。三件套工具：search（混合检索：向量+BM25+重排）、
          get_document（按文档 ID 读全文）、ask（带 [ref-N] 引用的 RAG 问答）。
          调用受租户隔离、安全护栏与配额治理；注入载荷将被拒绝。

# Spring AI 观测内容开关（Phase 4 簇①）唯一定义在 kb-ai-core/application-ai.yml
# （spring.config.import 导入源优先级高于本文件——簇①实证：双源定义时导入源覆盖）

# 日志 → 见 logback-spring.xml（dev 彩色控制台 / prod JSON 结构化）

# Actuator + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: kb-rag-agent
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
    export:
      otlp:
        # OTLP 导出总开关（Phase 4 簇①）：默认关——未配 Langfuse 凭据时零导出零噪音；
        # 开启须三件套同批：TRACING_OTLP_ENABLED=true + LANGFUSE_OTLP_AUTH（缺凭据会 401 噪音）
        enabled: ${TRACING_OTLP_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Boot 4.1 属性形态（实证：management.otlp.tracing.* 已迁此前缀）；
          # Langfuse OTLP 契约：EU Cloud /api/public/otel/v1/traces，仅 HTTP/protobuf（无 gRPC），
          # Basic Auth = base64(pk:sk)。endpoint 缺省 None 时自动配置不创建导出器。
          # 实证坑（簇①）：本属性为「信号专属 endpoint」，OTel Java SDK 原样使用、
          # 不自动追加 /v1/traces（仅 base endpoint 才追加）——必须带全路径，缺路径段
          # 则 Langfuse 回 404。直连实测 /api/public/otel/v1/traces=200、/api/public/otel=404。
          endpoint: ${LANGFUSE_OTLP_ENDPOINT:https://cloud.langfuse.com/api/public/otel/v1/traces}
          transport: http
          headers:
            Authorization: ${LANGFUSE_OTLP_AUTH:}
  prometheus:
    metrics:
      export:
        enabled: true

# 服务器
server:
  port: ${SERVER_PORT:8080}

app:
  ws:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173}

# ETL 管道（kb-etl）
kb:
  etl:
    # Contextual Retrieval 语境增强（簇④ A4，设计 9.5，默认开）：embedding 前
    # LLM 生成文档级语境前缀。2026-08-12 A/B 定案转默认开：新 Golden 双臂
    # chain 探针 Recall 0.902→0.931 / MRR 0.888→0.933 / CP 0.851→0.886，
    # 靶点 dm-13（跨 3 chunk 拆分表）0.000→0.667；回退置 false
    contextual:
      enabled: ${KB_ETL_CONTEXTUAL_ENABLED:true}
      excerpt-chars: ${KB_ETL_CONTEXTUAL_EXCERPT_CHARS:2000}      # 语境 prompt 的文档概要取前字符数
      chunk-max-chars: ${KB_ETL_CONTEXTUAL_CHUNK_MAX_CHARS:2000}  # 语境 prompt 的 chunk 文本截断长度
      concurrency: ${KB_ETL_CONTEXTUAL_CONCURRENCY:8}             # 语境 LLM 调用并发上限（API 限流时下调）


spring:
  config:
    import:
      - classpath:application-infra.yml
      - classpath:application-ai.yml

  application:
    name: kb-rag-agent

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 虚拟线程
  threads:
    virtual:
      enabled: true

  # JPA 行为配置（连接配置在 kb-infrastructure）
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}

# 日志 → 见 logback-spring.xml（dev 彩色控制台 / prod JSON 结构化）

# Actuator + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: kb-rag-agent
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  prometheus:
    metrics:
      export:
        enabled: true

# 服务器
server:
  port: ${SERVER_PORT:8080}

app:
  ws:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173}

# ETL 管道（kb-etl）
kb:
  etl:
    # Contextual Retrieval 语境增强（簇④ A4，设计 9.5，默认关）：embedding 前
    # LLM 生成文档级语境前缀。启用与否经 kb-eval 双探针 A/B 快照决策
    # （全量重入库窗口：off 基线 vs on 对比，报告 §8.3 簇④ A4 流程）
    contextual:
      enabled: ${KB_ETL_CONTEXTUAL_ENABLED:false}
      excerpt-chars: ${KB_ETL_CONTEXTUAL_EXCERPT_CHARS:2000}      # 语境 prompt 的文档概要取前字符数
      chunk-max-chars: ${KB_ETL_CONTEXTUAL_CHUNK_MAX_CHARS:2000}  # 语境 prompt 的 chunk 文本截断长度


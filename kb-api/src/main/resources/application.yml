spring:
  application:
    name: kb-rag-agent

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 虚拟线程
  threads:
    virtual:
      enabled: true

  # JPA 行为配置（连接配置在 kb-infrastructure）
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # AI 模型配置
  ai:
    vectorstore:
      type: custom

    # ── Model Provider 选择 ──
    model:
      chat: deepseek             # DeepSeek V4
      embedding: openai          # OpenAI 兼容（实际指向百炼）

    # ── DeepSeek V4 Chat ──
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
        temperature: 0.1
        max-tokens: 4096

    # ── 阿里云百炼 Embedding（OpenAI 兼容 API） ──
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      embedding:
        model: ${DASHSCOPE_EMBEDDING_MODEL:qwen3.7-text-embedding}

    observations:
      enabled: true
      include-prompt: false
      include-response: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}

# 日志
logging:
  level:
    com.enterprise.kb: DEBUG
    org.springframework.ai: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: kb-rag-agent
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}

# 服务器
server:
  port: ${SERVER_PORT:8080}

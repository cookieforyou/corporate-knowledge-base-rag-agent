spring:
  config:
    import:
      - classpath:application-infra.yml
      - classpath:application-ai.yml

  application:
    name: kb-rag-agent

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 虚拟线程
  threads:
    virtual:
      enabled: true

  # JPA 行为配置（连接配置在 kb-infrastructure）
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}

# 日志 → 见 logback-spring.xml（dev 彩色控制台 / prod JSON 结构化）

# Actuator + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: kb-rag-agent
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  prometheus:
    metrics:
      export:
        enabled: true

# 服务器
server:
  port: ${SERVER_PORT:8080}

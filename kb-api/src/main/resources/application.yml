spring:
  application:
    name: kb-rag-agent

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 虚拟线程
  threads:
    virtual:
      enabled: true

  # JPA 行为配置（连接配置在 kb-infrastructure）
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # AI 模型配置
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_MODEL:gpt-4o-mini}
        temperature: 0.1
        max-tokens: 4096
    ollama:
      chat:
        model: ${OLLAMA_MODEL:qwen2.5:14b}
        temperature: 0.1
    observations:
      enabled: true
      include-prompt: false
      include-response: false

# 日志
logging:
  level:
    com.enterprise.kb: DEBUG
    org.springframework.ai: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: kb-rag-agent
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}

# 服务器
server:
  port: ${SERVER_PORT:8080}

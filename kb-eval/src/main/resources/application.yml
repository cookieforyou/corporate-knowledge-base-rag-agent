# kb-eval 独立运行配置 —— 复用 kb-infrastructure / kb-ai-core 的配置片段
spring:
  config:
    import:
      - classpath:application-infra.yml   # PG/ES/Redis/MinIO/向量库（来自 kb-infrastructure jar）
      - classpath:application-ai.yml      # DeepSeek + Embedding（来自 kb-ai-core jar）
  application:
    name: kb-eval
  main:
    web-application-type: none            # 非 Web 应用，跑完即退（CI 友好）
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  ai:
    chat:
      memory:
        redis:
          # 3.1：评估进程不依赖 Redis——关闭启动期 FT.CREATE（Jedis 惰性建连，
          # 记忆 Bean 存在但被测 chatClient 链无记忆 Advisor，全程不触碰）
          initialize-schema: false

# ── 评估配置（阈值表对应设计文档 16.4，Phase 2 建基线期从宽）──
eval:
  # 与被测链路 rag.retrieval.top-k 同源绑定同一环境变量（簇① A3）——
  # 两处独立配置存在漂移风险：eval 度量 Recall@K 与链路实际产出 K 不一致时指标失真
  top-k: ${RAG_RETRIEVAL_TOP_K:5}
  sample-size: 0                          # CI 快跑可设 10（每类抽样）
  probe: ${EVAL_PROBE:auto}               # auto | vector | hybrid（A/B 基线对比）
  judge:
    base-url: ${EVAL_JUDGE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${DASHSCOPE_API_KEY:}        # 复用百炼 Key（Judge 默认 qwen3.7-plus，与被测 DeepSeek 跨厂商隔离）
    model: ${EVAL_JUDGE_MODEL:qwen3.7-plus}
    temperature: 0.0
    # qwen 商业版默认思考模式：评估 Judge 调用密集，默认关闭提速省 token
    # （注：Phase 2 基线为思考开启形态度量，复跑分数可能漂移，属评估校准范畴）
    enable-thinking: ${EVAL_JUDGE_ENABLE_THINKING:false}
  thresholds:
    top-k-recall: 0.85
    mrr: 0.70
    faithfulness: 4.0
    negative-rejection: 0.85
    regression: 0.03

---
# CI 门禁：mvn spring-boot:run -pl kb-eval -Dspring-boot.run.profiles=ci
spring:
  config:
    activate:
      on-profile: ci
eval:
  ci:
    enabled: true

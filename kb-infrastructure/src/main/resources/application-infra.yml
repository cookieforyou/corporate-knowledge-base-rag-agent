# ============================================================
# kb-infrastructure 基础设施连接默认配置
# 由 kb-api / kb-etl 等运行时模块继承，可被覆盖
# ============================================================

spring:
  # PostgreSQL（依赖由 kb-domain 引入，配置由 kb-infrastructure 承载）
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kb_rag_agent}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}

  # Flyway 迁移版本化（Phase 4 簇⑥ 4.11）：迁移脚本归 kb-domain
  # db/migration/（默认 locations，零配置命中）。baseline-on-migrate=true：
  # ECS 现网库存量表（无 flyway_schema_history）首跑插 baseline 行
  # （version=0）后应用 V1——全 DDL IF NOT EXISTS 幂等 no-op，仅登记
  # history；空库则直接建全套 schema。ddl-auto=validate 保留（Hibernate
  # 校验 Entity↔DDL 一致，Flyway 管演进双保险）。同源双写纪律：schema
  # 变更先 V(N+1) 再同步 schema.sql 快照（kb-eval IT init script 专用）。
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: '0'

  # Elasticsearch
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
    connection-timeout: 5s
    socket-timeout: 30s

  # Redis
  data:
    redis:
      database: ${REDIS_DB:0}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

# MinIO 对象存储
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:kb-documents}

# ============================================================
# kb.vector-store — 向量库多后端配置（替代 spring.ai.vectorstore.*）
# 通过 KB_VECTOR_STORE_PROVIDER 环境变量切换: pgvector | milvus
# ============================================================
kb:
  # ============================================================
  # 解析链路配置（2.1/2.2）—— RAM AccessKey 只经环境变量注入，禁止明文入库
  # ============================================================
  parsing:
    provider: ${KB_PARSING_PROVIDER:docmind}             # DEEP 链路后端：docmind | qwen-ocr
    deep-by-default: ${KB_PARSING_DEEP_BY_DEFAULT:true}  # PDF 默认走 DEEP（否则仅低密度扫描件走 OCR，常规走 NATIVE）
    docmind:
      endpoint: ${DOCMIND_ENDPOINT:docmind-api.cn-hangzhou.aliyuncs.com}
      access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
      llm-enhancement: ${DOCMIND_LLM_ENHANCEMENT:true}   # 大模型增强（解析大模型版）
      poll-interval-ms: ${DOCMIND_POLL_INTERVAL_MS:3000}
      max-polls: ${DOCMIND_MAX_POLLS:100}                # 3s × 100 ≈ 5 分钟上限
    qwen-ocr:
      base-url: ${QWEN_OCR_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${QWEN_OCR_MODEL:qwen3.5-ocr}
      api-key: ${DASHSCOPE_API_KEY:}                     # 复用百炼 Key
      dpi: ${QWEN_OCR_DPI:150}
      max-pages: ${QWEN_OCR_MAX_PAGES:50}

  # ETL 管道参数（簇① A3 配置化）
  etl:
    # 单批 embedding 条数：DashScope 硬限制 ≤20 条/请求（2026-08-03 E2E 缺陷修复），勿超
    embed-batch-size: ${KB_ETL_EMBED_BATCH_SIZE:10}
    # 入库安全消毒（簇② B1，12.4 S4 + PII 入库消毒）：
    # PII 掩码落库（kb_chunk/向量库/ES 脱敏态）+ 注入词表扫描打标（不阻断入库）。
    # 注入词表与对话链路同源：rag.guardrail.input.injection-keywords
    sanitize:
      pii-enabled: ${KB_ETL_SANITIZE_PII:true}
      injection-scan: ${KB_ETL_SANITIZE_INJECTION_SCAN:true}

  vector-store:
    provider: ${KB_VECTOR_STORE_PROVIDER:milvus}

    pgvector:
      table-name: ${KB_PGVECTOR_TABLE:kb_embeddings}
      schema-name: ${KB_PGVECTOR_SCHEMA:public}
      dimensions: ${KB_PGVECTOR_DIMENSIONS:1024}
      distance-type: ${KB_PGVECTOR_DISTANCE:COSINE_DISTANCE}
      index-type: ${KB_PGVECTOR_INDEX:HNSW}
      initialize-schema: ${KB_PGVECTOR_INIT_SCHEMA:false}

    milvus:
      host: ${KB_MILVUS_HOST:localhost}
      port: ${KB_MILVUS_PORT:19530}
      username: ${KB_MILVUS_USERNAME:}
      password: ${KB_MILVUS_PASSWORD:}
      database-name: ${KB_MILVUS_DATABASE:kb_rag_agent}
      collection-name: ${KB_MILVUS_COLLECTION:kb_chunks}
      embedding-dimension: ${KB_MILVUS_EMBEDDING_DIM:1024}
      index-type: ${KB_MILVUS_INDEX_TYPE:HNSW}
      metric-type: ${KB_MILVUS_METRIC_TYPE:COSINE}

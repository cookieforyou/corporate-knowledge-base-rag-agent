# ============================================================
# kb-infrastructure 基础设施连接默认配置
# 由 kb-api / kb-etl 等运行时模块继承，可被覆盖
# ============================================================

spring:
  # PostgreSQL（依赖由 kb-domain 引入，配置由 kb-infrastructure 承载）
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kb_rag_agent}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}

  # Elasticsearch
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
    connection-timeout: 5s
    socket-timeout: 30s

  # Redis
  data:
    redis:
      database: ${REDIS_DB:0}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

# MinIO 对象存储
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:kb-documents}

# ============================================================
# kb.vector-store — 向量库多后端配置（替代 spring.ai.vectorstore.*）
# 通过 KB_VECTOR_STORE_PROVIDER 环境变量切换: pgvector | milvus
# ============================================================
kb:
  vector-store:
    provider: ${KB_VECTOR_STORE_PROVIDER:milvus}

    pgvector:
      table-name: ${KB_PGVECTOR_TABLE:kb_embeddings}
      schema-name: ${KB_PGVECTOR_SCHEMA:public}
      dimensions: ${KB_PGVECTOR_DIMENSIONS:1024}
      distance-type: ${KB_PGVECTOR_DISTANCE:COSINE_DISTANCE}
      index-type: ${KB_PGVECTOR_INDEX:HNSW}
      initialize-schema: ${KB_PGVECTOR_INIT_SCHEMA:false}

    milvus:
      host: ${KB_MILVUS_HOST:localhost}
      port: ${KB_MILVUS_PORT:19530}
      username: ${KB_MILVUS_USERNAME:}
      password: ${KB_MILVUS_PASSWORD:}
      database-name: ${KB_MILVUS_DATABASE:kb_rag_agent}
      collection-name: ${KB_MILVUS_COLLECTION:kb_chunks}
      embedding-dimension: ${KB_MILVUS_EMBEDDING_DIM:1024}
      index-type: ${KB_MILVUS_INDEX_TYPE:HNSW}
      metric-type: ${KB_MILVUS_METRIC_TYPE:COSINE}

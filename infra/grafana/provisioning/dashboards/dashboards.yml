# Grafana 面板 provisioning（Phase 4 簇② 任务 4.3）
# 面板 JSON 源：infra/grafana/dashboards/（compose 挂载至 /var/lib/grafana/dashboards）
apiVersion: 1

providers:
  - name: kb-rag
    folder: KB-RAG
    type: file
    disableDeletion: false
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

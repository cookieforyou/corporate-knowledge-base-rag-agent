# ============================================================
# kb-rag 前端生产托管 + 同源反代 —— 宿主原生 nginx server 块
# （2026-09-10 F3 前端批；形态定案：复用 ECS 宿主已装 nginx，
#  不起容器 nginx——容器映射 80 会与宿主 nginx 端口冲突）
#
# 落位：本文件复制/软链到 /etc/nginx/conf.d/kb-frontend.conf
# 静态根：/opt/kb-rag-agent/frontend-dist（dist 部署包解压处）
# 反代目标：127.0.0.1:8090（宿主直连 compose 映射端口——比容器内
#   host.docker.internal 少一层，且不受 compose 栈启停影响配置）
#
# 前端事实（源码核验）：产物全相对路径——axios baseURL '/api/v1'、
# SSE chatStream '/api/v1/chat/stream'、WS 同源 '${proto}://${location.host}/ws/...'；
# vue-router createWebHistory()（history 模式）→ 必须 try_files 回退。
# 故本形态零前端代码改动、零运行时 env，BACKEND_URL 生产不消费。
# CORS：三处 location 均透传 Host $host（后端同源比对依赖）。浏览器侧同源无预检，
# 但同源 POST 仍携带 Origin 头，且域名 https 访问（TLS 前层终结、后端视角恒 http）
# 时后端必判跨 origin——CORS/WS 白名单（.env 两键）须含生产 origin，详手册 §7.4②。
#
# 配置坑位（改动前必读）：
#  - SSE (/api/v1/chat/stream)：proxy_buffering 必须 off——否则 TOKEN 帧
#    被攒批下发，流式观感/TTFT 失真；read_timeout 拉长防长对话掐流
#  - WS (/ws/etl/progress)：HTTP/1.1 + Upgrade/Connection 头——缺即握手 400
#  - history 路由：try_files 回退 index.html——缺即刷新非根路由 404
#  - client_max_body_size 60m：与后端上传上限同步（50MB 单文件 + 表单余量）
#  - /api/v1/chat/stream 须独立 location（nginx 最长前缀优先于 /api/）
#  - 80 已有其他站点时：本块 server_name 换实际 IP/域名区分，或删
#    既有 default.conf 的 default_server 声明（勿双 default_server）
# ============================================================
server {
    listen 80;
    # 80 无其他站点：保持 _（配合删除/禁用既有 default_server 块）；
    # 有其他站点：改成 ECS 公网 IP 或域名（同时既有站点保持其 server_name）
    server_name _;

    root /opt/kb-rag-agent/frontend-dist;
    index index.html;

    client_max_body_size 60m;

    # SPA history 路由回退（/login /admin /documents 等直刷不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 带内容哈希产物：长缓存不可变
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SSE 流式对话（先于 /api/ 命中：最长前缀匹配）
    location /api/v1/chat/stream {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WS（ETL 进度推送）
    location /ws/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 其余 API（同步/上传/MCP）
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}

# ============================================================
# 监控栈（簇② 4.3 本地自核验形态 → Phase 4 簇⑥ 批2 生产化，v2.56）
#
# 职责：
#   1. Prometheus 抓 kb-api（/actuator/prometheus）+ node_exporter 主机层
#   2. Grafana provisioning 四面板（infra/grafana/）
#   3. Jaeger all-in-one 收 OTLP HTTP——trace 残余诊断通道 + 通用
#      OTLP 后端（Langfuse 仍是 LLM 观测主平台，互补不替代）
#
# 连接口径（v2.56 生产化定案）：与应用面同为分层 compose，不共网络——
# Prometheus 经 host.docker.internal:8090 抓宿主映射端口（app compose
# 已暴露 8090），与批1b「存量不纳管、宿主地址连接」口径一致；将来若
# 探测存量共享网络直连，targets 可改服务名（prometheus.yml 内注释留档）。
#
# 生产化内容（批2）：各服务 restart + healthcheck（可做的）+ 资源限额 +
# 日志轮转；Grafana 口令经 infra/.env 注入（GRAFANA_ADMIN_USER/PASSWORD，
# 缺省 admin/admin 已废除——GRAFANA_ADMIN_PASSWORD 未设即拒绝启动）；
# node_exporter 补齐 Host 层告警数据源（alert-rules-kb-rag.yml kb-rag-host
# 组随之激活）；Jaeger 保留（scratch 基座无 shell——healthcheck 不可行，
# 实证留档，自愈靠 restart 策略）。
#
# 告警自检：promtool 单测文件挂 /etc/prometheus/rules-selfcheck/，
# 执行形态见 用户侧待执行项清单.md M1。
#
# 启停（从 infra/ 目录，消费同目录 .env）：
#   docker compose -f docker-compose.monitoring.yml up -d
# ============================================================

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules-kb-rag.yml:/etc/prometheus/rules/alert-rules-kb-rag.yml:ro
      - ./prometheus/alert-selfcheck:/etc/prometheus/rules-selfcheck:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # prom/prometheus 基座 busybox 自带 wget；/-/healthy 为原生探针端点
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEM_LIMIT:-1G}

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      # 口令经 .env 注入（compose 从 infra/ 目录启动时消费同目录 .env）；
      # GRAFANA_ADMIN_PASSWORD 未设即拒绝启动（:? 守卫，与禁 latest 同纪律）
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 未设（infra/.env）}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      # grafana 镜像 alpine 基座自带 busybox wget；/api/health 为原生探针端点
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEM_LIMIT:-512M}

  jaeger:
    # trace 诊断通道 + 通用 OTLP 后端（批4 trace 残余诊断消费）。
    # 实证（2026-08-20 核验）：all-in-one 为 scratch 基座，容器内无
    # shell/curl/wget——in-container healthcheck 不可行，自愈依赖
    # restart 策略 + OTLP 导出侧容错（导出失败不阻断业务链）。
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP HTTP（/v1/traces）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: ${JAEGER_MEM_LIMIT:-256M}

  node-exporter:
    # Host 层指标源（批2 新增）：磁盘/内存/负载——激活 alert-rules-kb-rag.yml
    # 中 kb-rag-host 组（HostDiskNearFull / HostMemoryNearFull）。
    # 形态：官方 README 推荐 host pid + / 只读挂载 + --path.* 重映射。
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: ${NODE_EXPORTER_MEM_LIMIT:-128M}

volumes:
  prometheus-data:
  grafana-data:

# kb-rag-agent Prometheus 主配置（Phase 4 簇② 任务 4.3）
#
# 挂载方式：infra/docker-compose.monitoring.yml 将本文件挂至 /etc/prometheus/prometheus.yml；
# 告警规则经 rule_files 接线簇① 落档的 alert-rules-kb-rag.yml（同目录挂载 rules/ 子目录）。
#
# scrape 目标口径：
# - 本地自核验（簇②）：kb-api 宿主机 mvn spring-boot:run 起于 8090，容器内经
#   host.docker.internal 回指宿主（compose 已配 extra_hosts host-gateway，Linux 亦可用）
# - ECS 生产化（簇⑥ Compose 生产加固）：targets 改为 compose 网络内服务名:8090
#
# actuator 端点 SecurityConfig 已 permitAll（13.3 v2.11 ③）；生产加固可选 IP 白名单。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alert-rules-kb-rag.yml

scrape_configs:
  - job_name: kb-rag-agent
    metrics_path: /actuator/prometheus
    static_configs:
      # 本地核验形态（宿主 8090）；簇⑥ ECS 部署时改为服务名
      - targets: ['host.docker.internal:8090']
        labels:
          application: kb-rag-agent
